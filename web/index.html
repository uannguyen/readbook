<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Đọc Truyện</title>
  <meta name="theme-color" content="#1f2a44">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <select id="chapterSelect" aria-label="Chọn chương"></select>
    <button id="settingsBtn" aria-label="Cài đặt">Aa</button>
  </header>

  <main id="reader" aria-live="polite"></main>

  <nav class="pager">
    <button id="prevBtn">‹ Chương trước</button>
    <button id="nextBtn">Chương sau ›</button>
  </nav>

  <dialog id="settings">
    <form method="dialog">
      <label>Font chữ
        <select id="fontSelect"></select>
      </label>
      <label>Cỡ chữ: <b id="sizeVal"></b>
        <input id="size" type="range" min="14" max="34" step="1">
      </label>
      <label>Giãn dòng: <b id="lhVal"></b>
        <input id="lh" type="range" min="1.3" max="2.4" step="0.1">
      </label>
      <div class="field">Nền &amp; màu chữ
        <div id="presets" class="presets"></div>
      </div>
      <div class="colors">
        <label>Màu nền <input id="bg" type="color"></label>
        <label>Màu chữ <input id="fg" type="color"></label>
      </div>
      <div class="actions">
        <button type="button" id="resetBtn">Mặc định</button>
        <button>Đóng</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
