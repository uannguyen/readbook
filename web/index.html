<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Đọc Truyện</title>
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#1f2a44">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <select id="chapterSelect" aria-label="Chọn chương"></select>
    <button id="settingsBtn" aria-label="Cài đặt">Aa</button>
  </header>

  <main id="reader" aria-live="polite"></main>

  <dialog id="settings">
    <form method="dialog">
      <label>Màu nền <select id="bgSelect"></select></label>
      <label>Font chữ <select id="fontSelect"></select></label>
      <label>Size chữ <select id="sizeSelect"></select></label>
      <label>Chiều cao dòng <select id="lhSelect"></select></label>
      <div class="field">Full khung
        <label class="radio"><input type="radio" name="full" value="yes"> Có</label>
        <label class="radio"><input type="radio" name="full" value="no"> Không</label>
      </div>
      <div class="actions">
        <button type="button" id="resetBtn">Mặc định</button>
        <button>Đóng</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
